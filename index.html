<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERSUS — Tier lists & Brackets</title>
<link rel="stylesheet" href="style.css?v=12">
</head>
<body class="bt-skin">
<div class="shell">
  <aside class="side">
    <div class="side-nav">
      <div class="logo">VERSUS<span>Tier lists &amp; brackets</span></div>
      <nav class="tabs">
        <button class="tab" data-tab="items">🎴 Éléments</button>
        <button class="tab" data-tab="tier">🏆 Tier list</button>
        <button class="tab" data-tab="bracket">⚔️ Bracket</button>
        <button class="tab" data-tab="blind">🎧 Blind test</button>
      </nav>
    </div>
    <div class="side-lib topbar">
      <div class="lib-head">
        <strong>Ma bibliothèque</strong>
        <button class="lib-plus" data-action="col-new" title="Nouvelle collection" aria-label="Nouvelle collection"><svg class="ic" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
      </div>
      <div class="collection">
        <select id="colSelect" title="Collection"></select>
        <button class="btn ghost sm" data-action="col-new" title="Nouvelle collection">＋ Nouvelle</button>
        <button class="btn ghost sm" data-action="col-rename">Renommer</button>
        <button class="btn ghost sm danger" data-action="col-delete">Supprimer</button>
      </div>
      <div id="colList" class="lib-list"></div>
      <div class="lib-tools">
        <button class="linkbtn" data-action="col-rename">Renommer</button>
        <button class="linkbtn" data-action="col-delete">Supprimer</button>
      </div>
    </div>
  </aside>

  <main id="app"></main>
</div>
<!-- PeerJS : connexion directe (WebRTC) entre l'hôte et les joueurs / spectateurs -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- QR code (généré dans le navigateur, rien n'est envoyé nulle part) -->
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<!-- ?v=… : à changer à chaque mise à jour pour que les navigateurs rechargent les fichiers -->
<script src="icons.js?v=12"></script>
<script src="spotify.js?v=12"></script>
<script src="blind.js?v=12"></script>
<script src="live.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
